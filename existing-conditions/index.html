<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Twin Oaks Ranch 3D site model: existing conditions</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfaf7;color:#1a1a1a;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.page{max-width:1200px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:28px;margin:0 0 6px}h2{font-size:19px;margin:28px 0 10px}
.summary{color:#5a5a5a;margin:0 0 8px}
.callout{border-radius:10px;padding:12px 14px;margin:12px 0;background:#eef3fb;border-left:4px solid #3b74d1}
.callout.warning{background:#fdf5e6;border-left-color:#d9921c}
.props{margin:0;display:grid;gap:6px}.props div{display:grid;grid-template-columns:minmax(120px,30%) 1fr;gap:12px;padding:6px 0;border-bottom:1px solid #e6e3dc}
.props dt{color:#5a5a5a}.props dd{margin:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid #e6e3dc;vertical-align:top}th{background:#f1efe9;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:20px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:#3a3a3a;cursor:pointer;min-height:32px}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog .sw{width:38px;height:22px;border-radius:11px;background:#c9c6be;position:relative;flex:none;transition:background .15s}
.tog .sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tog input:checked+.sw{background:#3b74d1}.tog input:checked+.sw:after{left:18px}
input[type=range]{width:100%;height:32px;accent-color:#3b74d1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cards a{display:block;padding:12px;border:1px solid #e1ded6;border-radius:10px;color:#1a1a1a;text-decoration:none;background:#fff}
.cards .site{display:block;font-size:12px;color:#5a5a5a}
ol{padding-left:22px}li{margin:4px 0}
canvas{display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style></head><body><div id="root"></div>
